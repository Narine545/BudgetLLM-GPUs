name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Проверка данных
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Целостность данных (без зависимостей)
        run: node tools/validate.js

  ui:
    name: Дымовой тест интерфейса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Установка dev-зависимостей
        run: npm install --no-audit --no-fund
      - name: Интерфейс: разделы, фильтры, сравнение, подбор
        run: npm run smoke

  offline:
    name: Проверка офлайн-режима
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: В index.html не должно быть внешних ресурсов
        run: |
          set -e
          if grep -nE '<(script|link|img|iframe)[^>]+(src|href)="https?://' index.html; then
            echo "::error::index.html подключает внешние ресурсы — база обязана работать офлайн"
            exit 1
          fi
          echo "Внешних ресурсов нет: база работает без интернета."
